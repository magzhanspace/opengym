name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: api
      - run: npm test
        working-directory: api

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: frontend
      - name: Locale and source-string checks
        working-directory: frontend
        run: |
          node scripts/check-locales.mjs
          node scripts/check-source-strings.mjs --strict
      - name: Generated files are up to date
        run: |
          node scripts/build-shared-assets.mjs --check
          node scripts/catalogue/build.mjs --check
      - run: npx vite build
        working-directory: frontend
      # The app-icon redraw check needs the icon toolchain of the release machine; it fails on a
      # plain runner as it did before the fork, so it is left out here.
      - run: npx vitest run --reporter=dot --exclude scripts/app-icons.test.mjs
        working-directory: frontend

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: mcp
      - run: npm test
        working-directory: mcp
